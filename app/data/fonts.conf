<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Wisp: fontconfig on the PS4 (FONTCONFIG_FILE). The packaged fonts: Liberation (metric-compatible
     with Arial, Times New Roman and Courier New), Roboto (system-ui), and Noto for every other script
     (fonts/noto: Arabic, Hebrew, the Indic scripts, Thai, CJK, emoji and the rest; scripts/get-noto-fonts.sh).
     The PS4's own fonts (/preinst) are not readable by an app.

     How WebKit picks a font for text its font lacks (SkiaSystemFallbackFontCache): it asks fontconfig
     for every font, sorted for the text's language, and takes the first one that has the characters.
     So the order below is the fallback order: first the fonts of the page's language (fontconfig's
     own language data, and the rules after it for the scripts that have several fonts), then the
     list at the end. -->
<fontconfig>
  <dir>/app0/wisp/fonts</dir>
  <dir>/preinst/common/font</dir>
  <cachedir>/data/Wisp/cache/fontconfig</cachedir>

  <alias binding="same"><family>sans-serif</family>
    <prefer><family>Liberation Sans</family><family>Roboto</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family>
    <prefer><family>Liberation Serif</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>system-ui</family>
    <prefer><family>Roboto</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>-apple-system</family>
    <prefer><family>Roboto</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family>
    <prefer><family>Roboto</family></prefer></alias>
  <alias binding="same"><family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer></alias>

  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Times</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Courier</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Liberation Mono</family></prefer></alias>
  <!-- the names pages give for these scripts on Windows, Apple systems and Android -->
  <alias binding="same"><family>Arabic Typesetting</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Traditional Arabic</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Simplified Arabic</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Geeza Pro</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Droid Arabic Naskh</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Droid Arabic Kufi</family><prefer><family>Noto Kufi Arabic</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>PingFang SC</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>PingFang TC</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>Microsoft JhengHei</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>Hiragino Sans</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Hiragino Kaku Gothic Pro</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Meiryo</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>MS Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Apple SD Gothic Neo</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Apple Color Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>

  <!-- the page's language, for the scripts with more than one font here -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>und-zsye</string></test>
    <edit name="family" mode="prepend"><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ur</string></test>
    <edit name="family" mode="prepend"><string>Noto Nastaliq Urdu</string><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="prepend"><string>Noto Naskh Arabic</string><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>fa</string></test>
    <edit name="family" mode="prepend"><string>Noto Naskh Arabic</string><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>he</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Hebrew</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK KR</string></edit>
  </match>
  <!-- (each prepend goes in front of the earlier ones: Chinese first, then its Taiwan and Hong Kong forms) -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK HK</string></edit>
  </match>

  <!-- then, for any language: Latin, Greek and Cyrillic, the Middle East, South and Southeast Asia,
       East Asia, the rest of Noto, symbols, emoji -->
  <match target="pattern">
    <edit name="family" mode="append_last">
      <string>Liberation Sans</string><string>Noto Sans</string>
      <string>Noto Naskh Arabic</string><string>Noto Sans Arabic</string><string>Noto Sans Hebrew</string>
      <string>Noto Sans Armenian</string><string>Noto Sans Georgian</string><string>Noto Sans Syriac</string>
      <string>Noto Sans Thaana</string><string>Noto Sans Devanagari</string><string>Noto Sans Bengali</string>
      <string>Noto Sans Gurmukhi</string><string>Noto Sans Gujarati</string><string>Noto Sans Oriya</string>
      <string>Noto Sans Tamil</string><string>Noto Sans Telugu</string><string>Noto Sans Kannada</string>
      <string>Noto Sans Malayalam</string><string>Noto Sans Sinhala</string><string>Noto Sans Thai</string>
      <string>Noto Sans Lao</string><string>Noto Sans Khmer</string><string>Noto Sans Myanmar</string>
      <string>Noto Serif Tibetan</string><string>Noto Sans Ethiopic</string>
      <string>Noto Sans CJK SC</string><string>Noto Sans CJK TC</string><string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string><string>Noto Sans Symbols</string><string>Noto Sans Symbols 2</string>
      <string>Noto Sans Math</string><string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
